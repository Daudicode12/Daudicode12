<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" role="img" aria-label="Terminal card: David Onyango, Full-Stack Engineer in Nairobi, Kenya" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Each clipPath is a rectangle whose width grows over time.
         That reveals its line of text left-to-right like typing.
         One 14s loop: values stay at 0 until the line's start time,
         grow to full width, then hold until the loop restarts. -->
    <clipPath id="c1"><rect x="40" y="62" height="26" width="0">
      <animate attributeName="width" values="0;0;820;820" keyTimes="0;0.02;0.08;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="92" height="26" width="0">
      <animate attributeName="width" values="0;0;820;820" keyTimes="0;0.09;0.20;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="122" height="26" width="0">
      <animate attributeName="width" values="0;0;820;820" keyTimes="0;0.22;0.28;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="152" height="26" width="0">
      <animate attributeName="width" values="0;0;820;820" keyTimes="0;0.29;0.40;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="182" height="26" width="0">
      <animate attributeName="width" values="0;0;820;820" keyTimes="0;0.42;0.48;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c6"><rect x="40" y="212" height="26" width="0">
      <animate attributeName="width" values="0;0;820;820" keyTimes="0;0.49;0.62;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- Window frame -->
  <rect x="1" y="1" width="898" height="268" rx="14" fill="#0D1117" stroke="#00F7FF" stroke-opacity=".35" stroke-width="2"/>
  <!-- Title bar -->
  <path d="M1 15a14 14 0 0 1 14-14h870a14 14 0 0 1 14 14v26H1z" fill="#161b22"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="21" r="6" fill="#27c93f"/>
  <text x="450" y="26" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#8b949e">david@nairobi: ~</text>

  <!-- Terminal lines (monospace, system font only: SVGs in READMEs can't load web fonts) -->
  <g font-family="'Courier New', monospace" font-size="18">
    <text x="40" y="82"  clip-path="url(#c1)"><tspan fill="#9D4EDD">$</tspan><tspan fill="#00F7FF"> whoami</tspan></text>
    <text x="40" y="112" clip-path="url(#c2)" fill="#c9d1d9">David Onyango | Full-Stack Engineer (backend-focused)</text>
    <text x="40" y="142" clip-path="url(#c3)"><tspan fill="#9D4EDD">$</tspan><tspan fill="#00F7FF"> cat focus.txt</tspan></text>
    <text x="40" y="172" clip-path="url(#c4)" fill="#c9d1d9">Node.js | Spring Boot | AI integration | Security</text>
    <text x="40" y="202" clip-path="url(#c5)"><tspan fill="#9D4EDD">$</tspan><tspan fill="#00F7FF"> echo $MISSION</tspan></text>
    <text x="40" y="232" clip-path="url(#c6)" fill="#c9d1d9">Build secure, scalable products with real-world impact</text>
  </g>

  <!-- Blinking cursor that appears once the last line has been typed -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.621;1" dur="14s" repeatCount="indefinite"/>
    <rect x="628" y="216" width="11" height="20" fill="#00F7FF">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
