<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="100%" role="img" aria-label="TECH STACK">
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00F7FF"/><stop offset="1" stop-color="#9D4EDD" stop-opacity="0"/></linearGradient>
  <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#00F7FF"/><stop offset="1" stop-color="#9D4EDD"/></linearGradient>
  <filter id="b" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect x="1" y="1" width="998" height="62" rx="10" fill="#0D1117" stroke="#00F7FF" stroke-opacity=".3"/>
<g fill="none" stroke="#00F7FF" stroke-width="2"><path d="M8 20V8H20"/><path d="M980 8H992V20"/><path d="M8 44V56H20"/><path d="M992 44V56H980"/></g>
<!-- spinning diamond -->
<g transform="translate(40 32)"><rect x="-9" y="-9" width="18" height="18" fill="none" stroke="#00F7FF" stroke-width="2">
  <animateTransform attributeName="transform" type="rotate" values="45;405" dur="6s" repeatCount="indefinite"/></rect>
  <rect x="-3" y="-3" width="6" height="6" fill="#9D4EDD"><animateTransform attributeName="transform" type="rotate" values="45;-315" dur="6s" repeatCount="indefinite"/></rect></g>
<text x="68" y="40" font-family="'Courier New', monospace" font-size="18" fill="#9D4EDD">// 02</text>
<text x="142" y="41" font-family="'Courier New', monospace" font-size="24" font-weight="bold" letter-spacing="3" fill="url(#t)">TECH STACK</text>
<rect x="332" y="31" width="628" height="2" fill="url(#g)"/>
<circle cy="32" r="6" fill="#00F7FF" filter="url(#b)"><animate attributeName="cx" values="332;960" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3.5s" repeatCount="indefinite"/></circle>
<circle cy="32" r="2.5" fill="#fff"><animate attributeName="cx" values="332;960" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3.5s" repeatCount="indefinite"/></circle>
</svg>
