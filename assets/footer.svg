<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00F7FF" stop-opacity="0"/><stop offset=".5" stop-color="#00F7FF"/><stop offset="1" stop-color="#9D4EDD" stop-opacity="0"/></linearGradient>
  <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#00F7FF"/><stop offset="1" stop-color="#9D4EDD"/></linearGradient>
