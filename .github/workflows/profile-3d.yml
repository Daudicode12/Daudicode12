name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"   # regenerate once a day (18:00 UTC)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed so the action can commit the generated SVGs

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      # Generates SVGs into ./profile-3d-contrib/
      # Check https://github.com/yoshi389111/github-profile-3d-contrib/releases
      # for the newest version tag and update it below if needed.
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          # Only commit if something actually changed
          git diff --staged --quiet || git commit -m "chore: update 3D contribution graph"
          git push
